apiVersion: v1
kind: ConfigMap
metadata:
  name: shawty-config
  namespace: shawty
data:
  PORT: "3000"
  BASE_URL: "http://localhost:3000"
  REDIS_CACHE_TTL_SECONDS: "3600"
  SHORTEN_RATE_LIMIT_WINDOW_MS: "60000"
  SHORTEN_RATE_LIMIT_MAX: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
  namespace: shawty
data:
  001-schema.sql: |
    CREATE SEQUENCE IF NOT EXISTS url_id_seq;

    CREATE TABLE IF NOT EXISTS urls (
      id BIGINT PRIMARY KEY DEFAULT nextval('url_id_seq'),
      short_code TEXT UNIQUE,
      long_url TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      expires_at TIMESTAMPTZ NOT NULL
    );

    ALTER TABLE urls ADD COLUMN IF NOT EXISTS expires_at TIMESTAMPTZ;
    UPDATE urls
    SET expires_at = created_at + interval '30 days'
    WHERE expires_at IS NULL;
    ALTER TABLE urls ALTER COLUMN expires_at SET NOT NULL;

    ALTER SEQUENCE url_id_seq OWNED BY urls.id;

    CREATE TABLE IF NOT EXISTS clicks (
      id BIGSERIAL PRIMARY KEY,
      url_id BIGINT NOT NULL REFERENCES urls(id) ON DELETE CASCADE,
      clicked_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS clicks_url_id_idx ON clicks(url_id);
