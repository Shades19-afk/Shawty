apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shawty
  namespace: shawty
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shawty
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # This will not meaningfully trigger locally without metrics-server and synthetic load.
