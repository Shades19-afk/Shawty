events {}

http {
  upstream url_shortener_apps {
    # Round-robin sends requests to different app processes. Redis is shared
    # by all of them, so cache entries and rate-limit counters remain
    # consistent instead of being isolated inside each replica.
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://url_shortener_apps;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
