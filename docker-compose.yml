services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    build: .
    environment: &app-environment
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shortener
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8080
      PORT: 3000
      REDIS_CACHE_TTL_SECONDS: 3600
      SHORTEN_RATE_LIMIT_WINDOW_MS: 60000
      SHORTEN_RATE_LIMIT_MAX: 10
      HOSTNAME: app1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      <<: *app-environment
      HOSTNAME: app2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app3:
    build: .
    environment:
      <<: *app-environment
      HOSTNAME: app3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:
